name: Check Norte (NAT/FOR)

on:
  schedule:
    # Una vez por día a las 08:00 UTC (05:00 Argentina)
    - cron: '0 8 * * *'

  workflow_dispatch:

jobs:
  check-norte:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ hashFiles('requirements.txt') }}
          restore-keys: pip-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore alert state (norte)
        uses: actions/cache@v4
        with:
          path: data/alert_state.json
          key: alert-state-norte
          restore-keys: alert-state-norte

      - name: Run price checker (zona norte)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m src.main --config config/routes-norte.json

      - name: Save alert state (norte)
        uses: actions/cache/save@v4
        if: always()
        with:
          path: data/alert_state.json
          key: alert-state-norte-${{ github.run_id }}
