name: Check Norte (NAT/FOR)

# NOTA: schedule desactivado — el repo está enfocado en BA→REC (ver check-recife).
# Las rutas Norte (NAT/FOR) quedan en config/routes-norte.json pero NO corren
# automáticamente. Para reactivarlas, descomentá el bloque schedule de abajo.
on:
  # schedule:
  #   # Cada 12h: 00:00 y 12:00 UTC (21:00 y 09:00 Argentina)
  #   - cron: '0 0,12 * * *'

  workflow_dispatch:

jobs:
  check-norte:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ hashFiles('requirements.txt') }}
          restore-keys: pip-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore alert state (norte)
        uses: actions/cache@v4
        with:
          path: data/alert_state.json
          key: alert-state-norte
          restore-keys: alert-state-norte

      - name: Run price checker (zona norte)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: timeout 3600 python -m src.main --config config/routes-norte.json

      - name: Commit alert history for dashboard
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data/alerts.json 2>/dev/null || true
          git diff --staged --quiet || (git commit -m "chore: update alert history [skip ci]" && git pull --rebase origin main && git push)

      - name: Save alert state (norte)
        uses: actions/cache/save@v4
        if: always()
        with:
          path: data/alert_state.json
          key: alert-state-norte-${{ github.run_id }}
