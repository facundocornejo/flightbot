name: Check Recife (REC/MCZ)

on:
  schedule:
    # Una vez por día a las 20:00 UTC (17:00 Argentina)
    - cron: '0 20 * * *'

  workflow_dispatch:

jobs:
  check-recife:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ hashFiles('requirements.txt') }}
          restore-keys: pip-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore alert state (recife)
        uses: actions/cache@v4
        with:
          path: data/alert_state.json
          key: alert-state-recife
          restore-keys: alert-state-recife

      - name: Run price checker (zona recife)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m src.main --config config/routes-recife.json

      - name: Save alert state (recife)
        uses: actions/cache/save@v4
        if: always()
        with:
          path: data/alert_state.json
          key: alert-state-recife-${{ github.run_id }}
