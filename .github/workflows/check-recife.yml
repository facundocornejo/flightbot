name: Check Recife (REC/MCZ)

on:
  schedule:
    # Cada 12h: 06:00 y 18:00 UTC (03:00 y 15:00 Argentina)
    - cron: '0 6,18 * * *'

  workflow_dispatch:

jobs:
  check-recife:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ hashFiles('requirements.txt') }}
          restore-keys: pip-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore alert state (recife)
        uses: actions/cache@v4
        with:
          path: data/alert_state.json
          key: alert-state-recife
          restore-keys: alert-state-recife

      - name: Run price checker (zona recife)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m src.main --config config/routes-recife.json

      - name: Commit alert history for dashboard
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data/alerts.json
          git diff --staged --quiet || (git commit -m "chore: update alert history [skip ci]" && git pull --rebase origin main && git push)

      - name: Save alert state (recife)
        uses: actions/cache/save@v4
        if: always()
        with:
          path: data/alert_state.json
          key: alert-state-recife-${{ github.run_id }}
